# Server block for nginxinc/nginx-unprivileged, mounted as /etc/nginx/conf.d/default.conf.
# add_header inside a location replaces the headers set at server level, so the
# /assets/ location repeats them. "always" keeps them on 404 answers too.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "no-referrer" always;
  # Placeholder policy; the real one is written with the portal build.
  add_header Content-Security-Policy "default-src 'self'" always;

  location /assets/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
