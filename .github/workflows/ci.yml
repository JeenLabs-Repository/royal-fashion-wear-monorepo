name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_build_placeholder
  GORGO_DISABLE_TELEMETRY: "true"
  MEDUSA_DISABLE_TELEMETRY: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  # Read access to the private plugin packages. Empty until the secret exists and
  # for fork pull requests; the .npmrc reference accepts an empty value.
  NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_REGISTRY_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm -C apps/backend run lint
      - run: pnpm -C apps/storefront run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm -C apps/backend exec tsc --noEmit
      - run: pnpm -C apps/storefront exec tsc --noEmit

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm -C apps/backend run build

  build-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm -C apps/storefront run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # One variable names the Postgres major; 17 is the fallback until the owner
        # reports the major of the database host. Never use latest.
        image: postgres:${{ vars.POSTGRES_VERSION || '17' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # CI-only test values. None of these is a secret.
      AUTH_MFA_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      TRUST_PROXY_HOPS: "0"
      BREAK_GLASS_ALERT_EMAILS: "ci-alerts@example.com"
      VENDOR_PORTAL_URL: "https://backend.example.test/vendor-portal"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - name: Check admin routes
        run: pnpm -C apps/backend run check:admin-routes
      - run: pnpm -C apps/backend run test:unit
      - run: pnpm -C apps/backend run test:integration:modules
      - run: pnpm -C apps/backend run test:integration:http

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm run guards

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml -v

  signatures:
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify commit signatures
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE..HEAD"
          elif [ "$BEFORE" != "$zero" ]; then
            range="$BEFORE..$SHA"
          else
            range="HEAD --not origin/main"
          fi
          sh scripts/verify-signatures.sh $range

  branch-name:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the branch name
        run: node scripts/check-branch-name.mjs "$BRANCH"

  vendor-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ vars.POSTGRES_VERSION || '17' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      - run: pnpm -C apps/vendor-portal run typecheck
      - run: pnpm -C apps/vendor-portal run test:unit
      # The build copies the static files into apps/backend/static/vendor-portal.
      - run: pnpm -C apps/vendor-portal run build
      - run: pnpm -C apps/backend run build
      # Builds and starts a backend on a throwaway database, then proves that it
      # serves the portal with its policy headers, refuses traversal and keeps
      # /admin and /vendor as API routes. The script makes its own test-only
      # secrets for the run and never prints them.
      - name: Check that the backend serves the portal
        run: sh scripts/check-portal-served.sh --start-backend --skip-build

  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:${{ vars.POSTGRES_VERSION || '17' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CANARY_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            sh scripts/write-registry-userconfig.sh
          fi
          pnpm install --frozen-lockfile
      # The run script generates its own random test-only secrets for every run,
      # keeps them in the process environment and never prints them. The backend
      # runs on the in-memory cache, locking and event bus, so no Redis service
      # is started.
      - name: Run the canary crawl
        run: sh scripts/run-canary.sh

  ci-gate:
    if: always()
    needs: [lint, typecheck, build-backend, build-storefront, backend-tests, guards, gitleaks, signatures, branch-name, vendor-portal, canary, pr-notes]
    runs-on: ubuntu-latest
    env:
      ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      LINT: ${{ needs.lint.result }}
      TYPECHECK: ${{ needs.typecheck.result }}
      BUILD_BACKEND: ${{ needs.build-backend.result }}
      BUILD_STOREFRONT: ${{ needs.build-storefront.result }}
      BACKEND_TESTS: ${{ needs.backend-tests.result }}
      GUARDS: ${{ needs.guards.result }}
      GITLEAKS: ${{ needs.gitleaks.result }}
      SIGNATURES: ${{ needs.signatures.result }}
      BRANCH_NAME: ${{ needs.branch-name.result }}
      VENDOR_PORTAL: ${{ needs.vendor-portal.result }}
      CANARY: ${{ needs.canary.result }}
      PR_NOTES: ${{ needs.pr-notes.result }}
    steps:
      - name: Summarise results
        run: |
          printf 'lint: %s\ntypecheck: %s\nbuild-backend: %s\nbuild-storefront: %s\nbackend-tests: %s\nguards: %s\ngitleaks: %s\nsignatures: %s\nbranch-name: %s\nvendor-portal: %s\ncanary: %s\npr-notes: %s\n' \
            "$LINT" "$TYPECHECK" "$BUILD_BACKEND" "$BUILD_STOREFRONT" "$BACKEND_TESTS" "$GUARDS" "$GITLEAKS" "$SIGNATURES" "$BRANCH_NAME" "$VENDOR_PORTAL" "$CANARY" "$PR_NOTES"
          if [ "$ANY_FAILED" = "true" ]; then
            echo "At least one required job failed or was cancelled."
            exit 1
          fi

  pr-notes:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      REQUIRE_PR_BODY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check the pull request notes
        run: node scripts/check-pr-notes.mjs
